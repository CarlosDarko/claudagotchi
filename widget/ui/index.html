<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claudagotchi</title>
<style>
  :root {
    --card: rgba(22, 21, 32, 0.95);
    --line: rgba(255, 255, 255, 0.09);
    --text: #ECEAF5;
    --soft: #A8A4C4;
    --dim: #807C99;
    --accent: #E07A55;
    --green: #5FD38D;
    --red: #FF6B5E;
    --empty: rgba(255, 255, 255, 0.10);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: transparent;
    font: 13px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--text);
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  canvas { image-rendering: pixelated; }
  #yard { position: absolute; left: 0; bottom: 0; }
  #pet { position: absolute; bottom: 0; will-change: transform; }
  #pet.shake { animation: shake .16s linear infinite; }
  @keyframes shake { 0%, 100% { translate: 0 0; } 25% { translate: -2px 0; } 75% { translate: 2px 0; } }
  .float { position: absolute; bottom: 0; transform: translateX(-50%); pointer-events: auto; }
  .hidden { display: none !important; }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  .fx { position: absolute; font-weight: 700; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .fx.spark { color: #FF9A6B; font-size: 18px; }
  .fx.gain { color: #FFD3C2; font-size: 12px; background: rgba(224,122,85,.9); color: #fff; padding: 1px 7px; border-radius: 999px; }
  .fx.heart { color: #FF6F91; font-size: 14px; }
  .fx.burst { color: #FFE27A; font-size: 14px; }
  .claude { color: var(--accent); font-weight: 700; }

  /* Pastilla */
  #badge {
    display: flex; align-items: center; gap: 5px; padding: 3px 9px 3px 8px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); font-size: 11px; font-weight: 650; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer;
  }
  #badge.working .claude { animation: spin 2.4s linear infinite; display: inline-block; }
  @keyframes spin { to { rotate: 360deg; } }
  #badge .alert { color: #fff; background: var(--accent); border-radius: 50%; width: 14px; height: 14px; display: grid; place-items: center; font-size: 10px; }

  /* Bocadillo */
  #bubble {
    max-width: 250px; padding: 8px 11px; border-radius: 12px; background: #FBF8F3; color: #26232F;
    font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.28); animation: pop .18s ease-out; pointer-events: none;
  }
  #bubble::after {
    content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px;
    border: 6px solid transparent; border-bottom: 0; border-top-color: #FBF8F3;
  }
  #bubble.alert { background: #FFE9DF; }
  #bubble.alert::after { border-top-color: #FFE9DF; }
  @keyframes pop { from { transform: translateX(-50%) scale(.9); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

  /* Tarjeta */
  #card {
    width: 330px; padding: 12px 14px 11px; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 12px 36px rgba(0,0,0,.35); backdrop-filter: blur(14px); animation: rise .16s ease-out;
  }
  @keyframes rise { from { opacity: 0; translate: 0 6px; } to { opacity: 1; translate: 0 0; } }
  .head { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 750; font-size: 15px; color: var(--accent); }
  .what { color: var(--soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mood { margin-left: auto; font-size: 11.5px; color: var(--soft); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .mood i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .tabs { display: flex; gap: 4px; margin: 9px 0 10px; padding: 3px; background: rgba(255,255,255,.05); border-radius: 10px; }
  .tabs button { all: unset; flex: 1; text-align: center; padding: 4px 0; border-radius: 7px; font-size: 12px; color: var(--soft); cursor: pointer; }
  .tabs button.on { background: rgba(255,255,255,.12); color: var(--text); font-weight: 650; }
  .tabs button:hover:not(.on) { color: var(--text); }
  .needs { display: grid; grid-template-columns: 74px 1fr; row-gap: 3px; align-items: center; }
  .needs .lbl { color: var(--soft); font-size: 12px; }
  .needs .lbl.low { color: var(--red); font-weight: 650; }
  .pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .pips span { height: 7px; border-radius: 2px; background: var(--empty); }
  .section { margin: 11px 0 6px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
  .meter { display: grid; grid-template-columns: 58px 40px 1fr; align-items: center; gap: 8px; margin-top: 5px; }
  .meter .pct { font-weight: 750; text-align: right; }
  .sub { margin: 1px 0 2px 106px; color: var(--dim); font-size: 11.5px; }
  .sub .warn { color: #FF9A85; }
  .sub .ok { color: var(--green); }
  .bar { height: 5px; border-radius: 3px; background: var(--empty); overflow: hidden; }
  .bar.big { height: 8px; margin: 8px 0 4px; }
  .bar b { display: block; height: 100%; border-radius: 3px; }
  .row { display: flex; justify-content: space-between; gap: 8px; color: var(--soft); font-size: 12px; margin-top: 5px; }
  .row strong { color: var(--text); }
  .dim { color: var(--dim); }
  .small { font-size: 11.5px; }
  .why { margin-top: 5px; color: #D9B48C; }
  .working { color: var(--green); }
  .egg .dim { font-size: 12px; color: var(--soft); }

  /* Acciones: icono pixel art + nombre completo */
  .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; margin-top: 11px; }
  .actions.one { grid-template-columns: 1fr; }
  .actions button {
    all: unset; display: grid; justify-items: center; gap: 2px; padding: 6px 2px 5px; border-radius: 10px;
    background: rgba(255,255,255,.05); border: 1px solid transparent; cursor: pointer; transition: background .12s, transform .08s;
  }
  .actions button img { width: 24px; height: 24px; image-rendering: pixelated; }
  .actions button small { font-size: 11px; color: var(--soft); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions button:hover { background: rgba(255,255,255,.11); }
  .actions button:hover small { color: var(--text); }
  .actions button:active { transform: scale(.96); }
  .actions button.hot { border-color: var(--accent); background: rgba(224,122,85,.16); }
  .actions button.hot small { color: var(--text); }
  .info { min-height: 28px; margin-top: 7px; font-size: 11.5px; color: var(--soft); line-height: 1.3; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--dim); }
  .link { all: unset; cursor: pointer; color: var(--soft); }
  .link:hover { color: var(--text); }

  /* Logros y colección */
  .medals { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 10px; }
  .medal img, .thumb img { width: 100%; image-rendering: pixelated; display: block; }
  .medal { padding: 2px; border-radius: 8px; }
  .medal:hover, .thumb:hover { background: rgba(255,255,255,.08); }
  .medal.locked img { opacity: .55; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 8px; }
  .thumb { border-radius: 8px; background: rgba(255,255,255,.04); padding: 5px; }
  .thumb.locked img { opacity: .8; }

  /* Minijuego */
  .game { text-align: center; padding: 6px 0 2px; }
  .game .q { font-weight: 650; margin-bottom: 8px; }
  .game .btns { display: flex; justify-content: center; gap: 10px; margin: 8px 0; }
  .game .btns button { all: unset; cursor: pointer; padding: 8px 22px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 16px; }
  .game .btns button:hover { background: rgba(255,255,255,.16); }
  .game .dots { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
  .game .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--empty); }
  .game .dots i.win { background: var(--green); }
  .game .dots i.lose { background: var(--red); }
</style>
</head>
<body>
  <canvas id="yard" class="hidden"></canvas>
  <canvas id="pet"></canvas>
  <div id="fx"></div>
  <div id="badge" class="float hidden"></div>
  <div id="bubble" class="float hidden"></div>
  <div id="card" class="float hidden"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
