# Al subir una etiqueta vX.Y.Z se compilan los programas para cada sistema
# (sin necesidad de Node) y se publican en GitHub Releases. Los instaladores
# descargan siempre la última versión de ahí.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: bun-darwin-arm64, name: darwin-arm64 }
          - { os: macos-latest, target: bun-darwin-x64, name: darwin-x64 }
          - { os: ubuntu-latest, target: bun-linux-x64, name: linux-x64 }
          - { os: ubuntu-latest, target: bun-linux-arm64, name: linux-arm64 }
          - { os: ubuntu-latest, target: bun-windows-x64, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Compilar
        run: |
          mkdir -p dist
          exe=claudagotchi; [ "${{ matrix.name }}" = windows-x64 ] && exe=claudagotchi.exe
          bun build bin/claudagotchi.js --compile --minify --target=${{ matrix.target }} --outfile "dist/$exe"
      - name: Firmar (macOS)
        if: startsWith(matrix.name, 'darwin')
        run: codesign --force --sign - dist/claudagotchi
      - name: Empaquetar
        run: |
          cd dist
          if [ "${{ matrix.name }}" = windows-x64 ]; then 7z a ../claudagotchi-${{ matrix.name }}.zip claudagotchi.exe; else tar -czf ../claudagotchi-${{ matrix.name }}.tar.gz claudagotchi; fi
      - uses: actions/upload-artifact@v4
        with:
          name: claudagotchi-${{ matrix.name }}
          path: claudagotchi-${{ matrix.name }}.*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --title "Claudagotchi ${{ github.ref_name }}" --generate-notes
